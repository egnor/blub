[tools]
arduino = "1.5.1"
# runs the RP2040 emulator, see tests/emulator/README.md
node = "latest"
python = "3.12"
uv = "0.12"
"github:probe-rs/probe-rs" = { matching = "probe-rs-tools", version = "0.32" }
"pipx:grip" = "4.6"

[tools."http:nrfutil"]
version = "0.0"

[tools."http:nrfutil".platforms.linux-x64]
url = "https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil"

[settings]
env_shell_expand = false
experimental = true
python.uv_venv_auto = "create|source"

[env]
# python & uv
PYTHONNOUSERSITE = "1"
UV_PROJECT_ENVIRONMENT = "{{config_root}}/dev.tmp/python_venv"

# Arduino
ARDUINO_DIRECTORIES_DATA = "{{config_root}}/dev.tmp/arduino"
ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL = "true"

# Nordic tools for cell modem build, see cell_modem/README.md
_.path = { path = "{{config_root}}/dev.tmp/nordic/bin" }
NRFUTIL_HOME = "{{config_root}}/dev.tmp/nordic"
PROBE_RS_CHIP = "nRF9151_xxAA"

[hooks]
postinstall = """
  echo '[git]'; git lfs install --local && git lfs pull
  echo '[arduino-cli]'; arduino-cli update
  echo '[npm]'; npm ci --prefix {{config_root|quote}}/tests/emulator
  echo '[uv]'; uv sync
"""

[tasks]
cu = { description = "compile + upload", depends = ["c", "u"] }
um = { description = "upload + monitor", depends = ["u", "m"] }
cum = { description = "compile + upload + monitor", depends = ["c", "um"] }

[tasks.arduino-c]
alias = "c"
description = "Compile Arduino sketch"
run = "arduino-cli compile"
dir = "{{cwd}}"

[tasks.arduino-u]
alias = "u"
description = "Upload Arduino sketch"
run = 'port={{vars.port_arg}} && arduino-cli upload --port="$port"'
dir = "{{cwd}}"
wait_for = "c"

[tasks.arduino-m]
alias = "m"
description = "Monitor Arduino sketch"
run = 'port={{vars.port_arg}} && arduino-cli monitor --port="$port"'
dir = "{{cwd}}"
wait_for = "u"
raw = true

[tasks.cell-modem-setup]
description = "Prepare Nordic cell modem build environment"
run = "cell_modem/nrf9151_build_setup.py"

[tasks.cell-modem-build]
description = "Incremental Nordic cell modem app build"
depends = "cell-modem-setup"
dir = "{{vars.cell_modem_app_dir}}"
run = [
  "mise x -- west build",
  "mise x -- hexmerge.py build/merged.hex {{config_root|quote}}/cell_modem/nrf9151_unlock_debug.hex -o build/merged-with-unlock.hex",
]
wait_for = "cell-modem-clean"

[tasks.cell-modem-clean]
description = "Clean Nordic cell modem build cache"
run = "rm -rf {{vars.cell_modem_app_dir|quote}}/build/"

[tasks.cell-modem-flash-all]
description = "Flash entire Nordic cell modem chip"
depends = ["cell-modem-build"]
depends_post = "cell-modem-reset"
run = [
  "probe-rs erase --allow-erase-all",
  "probe-rs download --binary-format=hex {{vars.cell_modem_app_dir|quote}}/build/merged-with-unlock.hex",
]

[tasks.cell-modem-flash-app]
description = "Flash Nordic cell modem app slot"
depends = "cell-modem-build"
depends_post = "cell-modem-reset"
run = "probe-rs download --binary-format=hex {{vars.cell_modem_app_dir|quote}}/build/app/zephyr/zephyr.signed.hex"

[tasks.cell-modem-logs]
description = "Print logs from Nordic cell modem chip"
dir = "{{vars.cell_modem_app_dir}}"
interactive = true
run = "probe-rs attach build/app/zephyr/zephyr.elf"
wait_for = ["cell-modem-reset"]

[tasks.cell-modem-reset]
description = "Reset Nordic cell modem chip"
run = "probe-rs reset"

[vars]
cell_modem_app_dir = "dev.tmp/nordic/workspace/circuitdojo-ncs-serial-modem/app"
uf2_dir = "/media/{{env.USER}}/RPI-RP2"
port_arg = "$(okserial -n1 RP2040 || ls -d {{vars.uf2_dir|quote}})"
