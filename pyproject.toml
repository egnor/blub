# Python project metadata, including dependencies & tool settings
# https://snarky.ca/what-the-heck-is-pyproject-toml

[project]
name = "blub"
version = "0.1"
requires-python = ">=3.12"

# Dependencies needed at runtime
dependencies = [
  "exif~=1.6.1",
  "ok-logging-setup~=0.2",
  "ok-serial~=0.6",
  "ok-subprocess-runner~=0.5",
  "ok-serial-terminal~=0.2",
  "paho-mqtt~=2.1",
  "pint~=0.24",
  "pyserial~=3.5",
  "python-debian>=1.0.1",
  "tomli-w>=1.2.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[tool.pytest]
addopts = ["--import-mode=importlib"]
# filterwarnings = ["ignore:record_xml_attribute .* experimental"]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
