# MCUboot config for the nRF9151 Feather
# (from circuitdojo/ncs-serial-modem app/sysbuild/mcuboot/boards/)

# Board drivers the bootloader doesn't need: nPM1300 PMIC, STS4x sensor
CONFIG_MFD_NPM13XX=n
CONFIG_GPIO_NPM13XX=n
CONFIG_STS4X=n

# No console in the bootloader
CONFIG_CONSOLE=n

CONFIG_MULTITHREADING=y
CONFIG_BOOT_MAX_IMG_SECTORS=256
