# Serial modem app config for the Circuit Dojo nRF9151 Feather.
# (Merges circuitdojo/ncs-serial-modem app/boards/circuitdojo_feather_nrf9151_ns.conf
# with our own settings.)

# Core Zephyr settings: RTT (debug probe) for logs, kernel heap for misc use
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_MEMFAULT=n
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y

CONFIG_SM_CUSTOMER_VERSION="blub"

# AT commands terminated by CR alone
CONFIG_SM_CR_TERMINATION=y

# No flow control on the Feather UART, allow generous buffer
CONFIG_SM_UART_RX_BUF_SIZE=2048
# Unsolicited Result Code (eg. MQTT inbound)
CONFIG_SM_URC_BUFFER_SIZE=8192
# Command "data mode" (eg. MQTT outbound)
CONFIG_SM_DATAMODE_BUF_SIZE=8192

# Disable serial modem features we don't use
CONFIG_SM_SMS=n
CONFIG_SM_NRF_CLOUD=n
CONFIG_SM_COAPC=n
CONFIG_SM_HTTPC=n

# Feather hardware: nPM1300 PMIC
CONFIG_MFD=y
CONFIG_MFD_NPM13XX=y

# Feather hardware: SPI NOR flash
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# Partition manager settings (from the Circuit Dojo fork). The partition
# manager itself is disabled in favor of DTS partitions, but NCS's TF-M
# build still consults PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY (which would
# otherwise default to y) when setting up the secondary slot.
CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=n
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y

# Feather hardware: GNSS antenna configuration
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT\%XCOEX0=1,1,1565,1586"
