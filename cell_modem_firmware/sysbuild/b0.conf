# B0 (NSIB) config for the nRF9151 Feather
# (from circuitdojo/ncs-serial-modem app/sysbuild/b0/prj.conf additions)

# Kernel timeouts are unused in B0 (upstream already sets NRF_RTC_TIMER=n).
CONFIG_SYS_CLOCK_EXISTS=n

# nfed's board startup.c (nPM1300 current limit + 2s sleep) is guarded by
# !MCUBOOT, which does not exclude B0, and it doesn't link there. Remove this
# once circuitdojo/nrf9160-feather-examples-and-drivers PR #24 lands in the
# pinned nfed revision (assigning an undefined symbol fails the build).
CONFIG_CIRCUITDOJO_FEATHER_NRF9151_PMIC_STARTUP=n
