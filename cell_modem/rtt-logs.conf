# Send the Zephyr console and logs to Segger RTT instead of uart0, so the
# boot banner and log messages stay off the AT port when AT is on uart0.
# Read the logs with: probe-rs attach build/app/zephyr/zephyr.elf
#
# Usage (from the app dir; $BLUB = this repo's root):
#   EXTRA_CONF_FILE=$BLUB/cell_modem/rtt-logs.conf west build -p
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
# Drop messages when nothing is reading RTT (default "block" mode would
# stall the log thread until a debugger drains the buffer).
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
